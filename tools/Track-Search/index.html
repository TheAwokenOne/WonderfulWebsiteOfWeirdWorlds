<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track and Operation Search</title>

    <link rel="stylesheet" href="../../common/styles.css">

    <style>
        .container {
            display: flex;
            gap: 24px;
            align-items: flex-start;
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .preliminary-warning {
            margin: 18px auto 0;
            max-width: 1400px;
            padding: 18px 24px;
            border: 4px solid #7f1d1d;
            border-radius: 8px;
            background: #fee2e2;
            color: #7f1d1d;
            font-size: clamp(1.25rem, 3vw, 2.25rem);
            font-weight: 900;
            line-height: 1.15;
            text-align: center;
            text-transform: uppercase;
            animation: warning-flash 1.2s steps(2, end) infinite;
        }

        @keyframes warning-flash {
            0%, 49% {
                background: #fee2e2;
                color: #7f1d1d;
            }

            50%, 100% {
                background: #dc2626;
                color: #ffffff;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .preliminary-warning {
                animation: none;
            }
        }

        .left {
            width: 380px;
            flex-shrink: 0;
        }

        .right {
            flex: 1;
            min-width: 0;
        }

        .section {
            margin-bottom: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-weight: 600;
            color: var(--color-text-main);
        }

        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            background: white;
            color: #000000;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group select option {
            color: #000000;
            background: white;
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--color-secondary);
            box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.18);
        }

        .search-button {
            width: 100%;
            margin-top: 6px;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .status {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.4;
        }

        .status.info {
            background: #eef6ff;
            border: 1px solid #b9dcff;
            color: #164e7a;
        }

        .status.success {
            background: #ecfdf3;
            border: 1px solid #a7e7bd;
            color: #176534;
        }

        .status.error {
            background: #fff1f1;
            border: 1px solid #f0b4b4;
            color: #9b1c1c;
        }

        .selection-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(130px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }

        .summary-item {
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            padding: 11px 12px;
        }

        .summary-label {
            display: block;
            font-size: 11px;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 4px;
        }

        .summary-value {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text-main);
        }

        .side-section {
            margin-bottom: 24px;
        }

        .side-title {
            margin: 0 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--color-secondary);
            color: var(--color-text-main);
        }

        .tracks-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(260px, 1fr)
            );
            gap: 14px;
        }

        .track-card {
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .track-card:hover {
            border-color: var(--color-secondary);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.20);
            transform: translateY(-1px);
        }

        .track-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            background: linear-gradient(
                135deg,
                var(--color-primary),
                var(--color-primary-dark)
            );
            color: white;
        }

        .track-number {
            font-size: 18px;
            font-weight: 700;
        }

        .track-length {
            color: var(--color-tertiary);
            font-size: 15px;
            font-weight: 700;
        }

        .track-visual {
            padding: 12px 12px 10px;
            background: rgba(17, 24, 39, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .track-rail {
            background: #1f2937;
            border: 2px solid rgba(13, 23, 36, 0.95);
            border-radius: 6px;
            padding: 8px 8px 10px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        .track-sections {
            display: grid;
            grid-template-columns: repeat(
                var(--track-section-count, 3),
                minmax(28px, 1fr)
            );
            gap: 6px;
            min-height: 62px;
        }

        .track-section {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 62px;
            background: rgba(10, 16, 24, 0.9);
            border: 2px solid rgba(148, 163, 184, 0.4);
            border-radius: 3px;
            overflow: hidden;
        }

        .track-section-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 4px 2px;
        }

        .track-symbol-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 100%;
        }

        .track-symbol {
            display: inline-block;
            flex-shrink: 0;
            box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.3);
        }

        .track-symbol.light {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            background: #facc15;
        }

        .track-symbol.speaker {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #39d98a;
        }

        .track-section-label {
            color: #e5e7eb;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            line-height: 1;
            white-space: nowrap;
        }

        .unit-overview {
            margin: 0 0 20px;
            padding: 12px 12px 10px;
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: 10px;
        }

        .unit-overview-bar {
            position: relative;
            background: #1f2937;
            border: 2px solid rgba(13, 23, 36, 0.95);
            border-radius: 8px;
            padding: 8px;
        }

        .unit-overview-track-boxes {
            position: absolute;
            inset: 8px 8px 8px 8px;
            pointer-events: none;
            z-index: 2;
        }

        .unit-overview-track-box {
            position: absolute;
            top: -2px;
            bottom: -2px;
            border: 5px solid rgba(255, 105, 180, 1);
            border-radius: 8px;
            background: rgba(255, 105, 180, 0.14);
            box-sizing: border-box;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
        }

        .unit-overview-grid {
            position: relative;
            display: grid;
            grid-template-columns: repeat(
                var(--unit-section-count, 1),
                minmax(16px, 1fr)
            );
            gap: 4px;
            min-height: 54px;
            z-index: 1;
        }

        .unit-overview-section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 54px;
            background: rgba(10, 16, 24, 0.9);
            border: 2px solid rgba(148, 163, 184, 0.38);
            border-radius: 4px;
            overflow: hidden;
        }

        .unit-overview-symbols {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 100%;
            height: 100%;
            padding: 4px 2px;
        }

        .unit-overview-symbol {
            display: inline-block;
            box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.25);
        }

        .unit-overview-symbol.light {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            background: #facc15;
        }

        .unit-overview-symbol.speaker {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #39d98a;
        }

        .operation-list {
            display: flex;
            flex-direction: column;
        }

        .operation-row {
            display: grid;
            grid-template-columns: max-content 1fr auto;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-bottom: 1px solid #eeeeee;
        }

        .operation-row:last-child {
            border-bottom: none;
        }

        .mark-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 30px;
            border-radius: 6px;
            background: var(--color-tertiary);
            color: #222222;
            font-weight: 700;
            font-size: 13px;
            padding: 0 10px;
            white-space: nowrap;
        }

        .operation-code {
            font-size: 15px;
            font-weight: 700;
            color: var(--color-text-main);
        }

        .operation-description {
            margin-top: 2px;
            font-size: 12px;
            color: var(--color-text-muted);
        }

        .operation-type {
            padding: 4px 7px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .operation-type.light {
            background: #fff8d8;
            color: #735c00;
        }

        .operation-type.speaker {
            background: #e7f4ff;
            color: #075985;
        }

        .empty-results {
            padding: 30px 20px;
            text-align: center;
            color: var(--color-text-muted);
            border: 1px dashed var(--color-border);
            border-radius: 8px;
        }

        .operation-count {
            margin-bottom: 14px;
            color: var(--color-text-muted);
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }

            .left {
                width: 100%;
            }

            .right {
                width: 100%;
            }

            .selection-summary {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 520px) {
            .selection-summary {
                grid-template-columns: 1fr;
            }

            .tracks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <script src="../../common/nav.js"></script>

    <div class="preliminary-warning" role="alert">
        This data is preliminary and should not be used for production decisions
    </div>

    <div class="container">

        <!-- LEFT PANEL -->
        <div class="left">

            <h2>Track and Operation Search</h2>

            <div class="card section">

                <div class="form-grid">

                    <div class="form-group">
                        <label for="unitLength">
                            Unit Length
                        </label>

                        <select id="unitLength">
                            <option value="">
                                Loading...
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="plus9Location">
                            Plus 9 Location
                        </label>

                        <select id="plus9Location">
                            <option value="">
                                Select a unit length first
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="lightConfiguration">
                            Light Configuration
                        </label>

                        <select id="lightConfiguration">
                            <option value="">
                                Select Plus 9 location first
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="speakerConfiguration">
                            Speaker Configuration
                        </label>

                        <select id="speakerConfiguration">
                            <option value="">
                                Select light configuration first
                            </option>
                        </select>
                    </div>

                    <button
                        type="button"
                        class="search-button"
                        onclick="runSearch()"
                    >
                        Get Tracks and Operations
                    </button>

                </div>

                <div
                    id="status"
                    class="status info"
                >
                    Loading track database...
                </div>

            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="right">

            <div class="card section">

                <h2>Tracks and Operations</h2>

                <div id="selectionSummary"></div>

                <div id="results">
                    <div class="empty-results">
                        Select a configuration to view the tracks
                        and operations.
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
