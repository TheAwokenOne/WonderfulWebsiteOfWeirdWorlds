<!DOCTYPE html>
<html>
<head>
    <title>Excel Shortcuts & Tips</title>

    <link rel="stylesheet" href="../../common/styles.css">

    <style>
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        /* search bar */
        .search-box {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--color-border);
            box-sizing: border-box;
            margin-bottom: 16px;
        }

        /* grid */
        .shortcut-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        /* item */
        .shortcut-card {
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            padding: 12px;

            transition: all 0.2s ease;
        }

        .shortcut-card:hover {
            border-color: var(--color-secondary);
            box-shadow: 0 0 8px rgba(6, 182, 212, 0.25);
            transform: translateY(-2px);
        }

        .shortcut-key {
            font-weight: 700;
            font-size: 15px;
            color: var(--color-primary);
        }

        .shortcut-title {
            font-size: 14px;
            margin-top: 4px;
            font-weight: 600;
        }

        .shortcut-tip {
            font-size: 12px;
            margin-top: 6px;
            color: var(--color-text-muted);
        }
    </style>
</head>

<body>

<script src="../../common/nav.js"></script>

<div class="container">

    <div class="card">

        <h2 style="margin-top:0;">Excel Shortcuts & Tips</h2>

        <!-- SEARCH -->
        <input 
            type="text" 
            id="searchInput" 
            class="search-box"
            placeholder="Search shortcuts or tips..."
        >

        <!-- GRID -->
        <div id="shortcutGrid" class="shortcut-grid"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
